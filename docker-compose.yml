services:
  db:
    # Keep the tag in step with storetest.Image.
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: dfm
      POSTGRES_PASSWORD: dfm
      POSTGRES_DB: dfm
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${DFM_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfm -d dfm"]
      interval: 2s
      timeout: 5s
      retries: 30

  dfm:
    build: .
    environment:
      DFM_HTTP_ADDR: ":8080"
      DFM_LOG_LEVEL: ${DFM_LOG_LEVEL:-INFO}
      DFM_DATABASE_URL: postgres://dfm:dfm@db:5432/dfm?sslmode=disable
    ports:
      - "${DFM_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
