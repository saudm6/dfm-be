    DocumentKind:
      type: string
      description: What a document holds, a workspace `layout` or a `chart_template`.
      enum: [layout, chart_template]
      x-go-type: domain.DocumentKind
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    DocumentName:
      type: string
      description: |
        1 to 64 characters of A-Z, a-z, 0-9, space, '_', '.' and '-',
        starting with a letter or digit and not ending with a space.
        Case-sensitive. Percent-encode spaces in the path.
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9]([A-Za-z0-9 _.-]{0,62}[A-Za-z0-9_.-])?$"
      examples: [Morning]

    DocumentBody:
      type: object
      description: |
        The document itself: any JSON object, kept as written apart from
        insignificant whitespace. The server does not interpret it.
      additionalProperties: true
      # The generated code already imports encoding/json.
      x-go-type: json.RawMessage

    Document:
      type: object
      required: [kind, name, schemaVersion, body]
      properties:
        kind:
          $ref: "#/components/schemas/DocumentKind"
          x-order: 1
        name:
          $ref: "#/components/schemas/DocumentName"
          x-order: 2
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          description: The version of the client's schema for body.
          x-order: 3
        body:
          $ref: "#/components/schemas/DocumentBody"
          x-order: 4

    PutDocumentRequest:
      type: object
      required: [schemaVersion, body]
      properties:
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          description: The version of the client's schema for body.
          x-order: 1
        body:
          $ref: "#/components/schemas/DocumentBody"
          x-order: 2

    DocumentInfo:
      type: object
      description: A stored document without its body.
      required: [name, etag, updatedAt]
      properties:
        name:
          $ref: "#/components/schemas/DocumentName"
          x-order: 1
        etag:
          type: string
          description: The document's entity tag, quoted, as sent in the ETag header. Send it as is in If-Match.
          examples: ["\"0f1d6a2b9c3e4d5f60718293a4b5c6d7\""]
          x-go-name: ETag
          x-order: 2
        updatedAt:
          type: string
          format: date-time
          x-order: 3

    DocumentList:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentInfo"


