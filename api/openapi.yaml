openapi: 3.1.0
info:
  title: DFM trader terminal API
  version: 0.1.0
  description: |
    The HTTP contract between dfm-be and dfm-fe. The backend's strict server in
    internal/httpapi/gen and the frontend's typed client are both generated from
    this file. Live data is pushed over the WebSocket described in
    api/websocket.md.

    Conventions:
    - JSON field names are lowerCamelCase.
    - Prices and money values are decimal strings, never JSON numbers. The
      server writes them without trailing zeros: "11.4", "0", "56500000.5".
    - Times are RFC 3339 with an offset. Dates are YYYY-MM-DD.
    - Every non-2xx response carries the Error body, including unknown paths
      (404 not_found), wrong methods (405 method_not_allowed), and server
      faults (500 internal). The only exception is a declared non-2xx
      response with its own body, such as the 503 of /healthz.

    Authentication:
    - Every operation needs a session except the three that declare
      `security: []`: /healthz, /openapi.yaml and POST /auth/login. The
      server keeps that list itself (api.PublicOperations), so any other
      operation needs a session whatever its security says. Each operation
      declares at most one security requirement object. POST /auth/login sets
      the session cookie `dfm_session` (HttpOnly, SameSite=Strict, Path=/,
      Secure unless the server runs with DFM_COOKIE_SECURE=false). Browsers
      send it back on their own; clients never read it.
    - A missing, unknown, or expired session gets 401 unauthorized.
    - CSRF: every session has a CSRF token, returned in the `csrfToken`
      field of POST /auth/login and GET /me. Send it in the `X-CSRF-Token`
      header on every POST, PUT, PATCH, and DELETE that needs a session. A
      missing or wrong token gets 403 forbidden. The token lasts as long as
      the session.
    - Scopes on `sessionCookie` name what the account's role must allow.
      `marketData` (quotes, history, orders, positions) is granted to the
      `owner` role only; a `member` gets 403 forbidden. Operations without a
      scope (chat, layouts) are open to every signed-in account.

    Layout: one tagged section per feature in `paths` and in
    `components.schemas`, F00 to F13 then H. Add a feature's paths and schemas
    only inside its own section so parallel changes merge cleanly.

servers:
  - url: /

security:
  - sessionCookie: []

tags:
  - name: foundation
    description: F00 Foundation. Health, the contract itself, accounts and sessions, source status.
  - name: security-master
    description: F01 Security master, search, and command line.
  - name: quotes
    description: F02 Live quotes and watchlists.
  - name: movers
    description: F03 Movers and heat map.
  - name: disclosures
    description: F04 News and disclosures.
  - name: alerts
    description: F05 Alerts.
  - name: launchpad
    description: F06 Launchpad workspace.
  - name: studies
    description: F07 Technical studies.
  - name: correlation
    description: F08 Correlation and pair spreads.
  - name: custom-series
    description: F09 Custom spreads and baskets.
  - name: orders
    description: F10 Order entry.
  - name: positions
    description: F11 Positions and live P&L.
  - name: chat
    description: F12 Chat.
  - name: portfolio
    description: F13 Portfolio analytics.
  - name: history
    description: H Market history and price charts.

paths:
  # ==========================================================================
  # foundation (F00)
  # ==========================================================================

  /healthz:
    get:
      operationId: getHealth
      summary: Report whether the service and its database are up
      tags: [foundation]
      security: []
      responses:
        "200":
          description: The service is up and the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: {status: ok, db: ok}
        "503":
          description: The database did not answer a ping within 2 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example: {status: unavailable, db: unavailable}
        default:
          $ref: "#/components/responses/Error"

  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Download this contract
      tags: [foundation]
      security: []
      responses:
        "200":
          description: This OpenAPI document as YAML.
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /auth/login:
    post:
      operationId: login
      summary: Sign in and start a session
      description: |
        Checks the username and password and starts a session. The response
        sets the session cookie and carries the session's CSRF token. An
        unknown username and a wrong password get the same 401. The request
        must be `Content-Type: application/json` (415 unsupported_media_type
        otherwise) and at most 4096 bytes (400 bad_request otherwise). A
        successful login ends the session named by the request's existing
        `dfm_session` cookie, if any.
      tags: [foundation]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie, `dfm_session=...; Path=/; Max-Age=...; HttpOnly; Secure; SameSite=Strict`.
              required: true
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: The username or password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: unauthorized, message: invalid username or password}
        "415":
          description: The request body is not `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: unsupported_media_type, message: send the login request as application/json}
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: Deletes the session on the server and expires the cookie.
      tags: [foundation]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Expires the session cookie, `dfm_session=; Path=/; Max-Age=0; ...`.
              required: true
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /me:
    get:
      operationId: getMe
      summary: Describe the signed-in account and its session
      tags: [foundation]
      responses:
        "200":
          description: The signed-in account.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /market/status:
    get:
      operationId: getMarketStatus
      summary: Report the DFM session now and when continuous trading next opens
      tags: [foundation]
      responses:
        "200":
          description: The current session and the next open, from the trading calendar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketStatus"
              example: {session: closed, nextOpen: "2026-10-19T10:00:00+04:00"}
        "503":
          description: The trading calendar could not be loaded within 2 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: unavailable, message: trading calendar unavailable}
        default:
          $ref: "#/components/responses/Error"

  # ==========================================================================
  # security-master (F01)
  # ==========================================================================

  # ==========================================================================
  # quotes (F02)
  # ==========================================================================

  # ==========================================================================
  # movers (F03)
  # ==========================================================================

  # ==========================================================================
  # disclosures (F04)
  # ==========================================================================

  # ==========================================================================
  # alerts (F05)
  # ==========================================================================

  # ==========================================================================
  # launchpad (F06)
  # ==========================================================================

  /me/documents/{kind}:
    parameters:
      - $ref: "#/components/parameters/DocumentKindParam"
    get:
      operationId: listMyDocuments
      summary: List the signed-in user's documents of one kind
      description: |
        Names, entity tags, and update times of the signed-in user's
        documents of this kind, ordered by name. Bodies are not included.
      tags: [launchpad]
      responses:
        "200":
          description: The documents, possibly none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
              example:
                documents:
                  - {name: Morning, etag: "\"0f1d6a2b9c3e4d5f60718293a4b5c6d7\"", updatedAt: "2026-10-15T09:30:00Z"}
        default:
          $ref: "#/components/responses/Error"

  /me/documents/{kind}/{name}:
    parameters:
      - $ref: "#/components/parameters/DocumentKindParam"
      - $ref: "#/components/parameters/DocumentNameParam"
    get:
      operationId: getMyDocument
      summary: Get one of the signed-in user's documents
      description: |
        Returns the document and its strong entity tag in the ETag header.
        Send that tag in If-Match to update or delete the document. Each
        account sees only its own documents; another account's document of
        the same kind and name is 404.
      tags: [launchpad]
      responses:
        "200":
          description: The document.
          headers:
            ETag:
              $ref: "#/components/headers/DocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: The signed-in user has no document of this kind and name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: not_found, message: no layout named "Morning"}
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: putMyDocument
      summary: Create or replace one of the signed-in user's documents
      description: |
        Without If-Match, creates the document and fails with 428 if it
        already exists. With If-Match, replaces the document only if it
        exists and its current entity tag is one of those listed (or the
        header is `*`); otherwise 412, so a client never overwrites a
        version it has not seen. The request body is at most 262144 bytes
        (256 KiB); a larger one gets 413 before it is decoded.
      tags: [launchpad]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutDocumentRequest"
      responses:
        "200":
          description: Replaced.
          headers:
            ETag:
              $ref: "#/components/headers/DocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentInfo"
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/DocumentETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentInfo"
        "412":
          description: |
            If-Match was sent, and the document does not exist or its entity
            tag is not one of those listed. GET it again and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: precondition_failed, message: "layout \"Morning\" has changed or does not exist; get it again"}
        "413":
          description: The request body is larger than 262144 bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: content_too_large, message: request body is larger than 262144 bytes}
        "428":
          description: The document exists and the request has no If-Match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: precondition_required, message: "layout \"Morning\" exists; send If-Match with its ETag to replace it"}
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyDocument
      summary: Delete one of the signed-in user's documents
      description: |
        Needs If-Match: deletes the document only if its current entity tag
        is one of those listed (or the header is `*`).
      tags: [launchpad]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Deleted.
        "404":
          description: The signed-in user has no document of this kind and name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: not_found, message: no layout named "Morning"}
        "412":
          description: The document's entity tag is not one of those in If-Match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: precondition_failed, message: "layout \"Morning\" has changed or does not exist; get it again"}
        "428":
          description: The request has no If-Match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: {code: precondition_required, message: send If-Match with the document's ETag to delete it}
        default:
          $ref: "#/components/responses/Error"


  # ==========================================================================
  # studies (F07)
  # ==========================================================================

  # ==========================================================================
  # correlation (F08)
  # ==========================================================================

  # ==========================================================================
  # custom-series (F09)
  # ==========================================================================

  # ==========================================================================
  # orders (F10)
  # ==========================================================================

  # ==========================================================================
  # positions (F11)
  # ==========================================================================

  # ==========================================================================
  # chat (F12)
  # ==========================================================================

  # ==========================================================================
  # portfolio (F13)
  # ==========================================================================

  # ==========================================================================
  # history (H)
  # ==========================================================================

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: dfm_session
      description: |
        The session cookie set by POST /auth/login. Scopes listed with it
        name the permissions the account's role needs: `marketData` is
        granted to `owner` only.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The session's CSRF token from POST /auth/login or GET /me. Required
        on every POST, PUT, PATCH, and DELETE that needs a session.

  headers:
    DocumentETag:
      description: The document's strong entity tag, quoted, for example `"0f1d6a2b9c3e4d5f60718293a4b5c6d7"`.
      required: true
      schema:
        type: string
    NoStore:
      description: |
        `no-store`, on responses that carry the CSRF token, so no cache
        keeps it.
      required: true
      schema:
        type: string
        const: no-store

  parameters:
    DocumentKindParam:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DocumentKind"
    DocumentNameParam:
      name: name
      in: path
      required: true
      description: The name of the document, a DocumentName. Any other value gets 400.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: |
        `*` or a comma-separated list of entity tags, as returned in ETag.
        Weak tags (`W/"..."`) never match.
      schema:
        type: string

  responses:
    Error:
      description: The request failed. The body says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ==========================================================================
    # shared: errors, scalars, and the core market types (internal/domain)
    # ==========================================================================

    Error:
      type: object
      description: The body of every non-2xx response.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable reason in snake_case. Clients branch on
            this, never on message. Known codes: bad_request, unauthorized,
            forbidden, not_found, method_not_allowed, conflict,
            precondition_failed (an If-Match precondition does not hold),
            content_too_large, precondition_required (the request needs
            If-Match), unsupported_media_type, internal, unavailable (a
            dependency such as the database did not answer; retry later).
          examples: [not_found]
        message:
          type: string
          description: Human-readable detail. Safe to show to the user.
          examples: ["instrument EMAAR not found"]

    Symbol:
      type: string
      description: |
        DFM trading code: 1 to 16 characters of A-Z and 0-9, with inner
        space, '-', '_', or '.' (for example "EMAAR", "NBD GULF",
        "TAKAFUL-EM", "SALAM_BAH"). The server upper-cases and trims input
        symbols before validating them.
      minLength: 1
      maxLength: 16
      pattern: "^[A-Z0-9]([A-Z0-9 ._-]*[A-Z0-9])?$"
      examples: [EMAAR]

    Decimal:
      type: string
      description: |
        An exact decimal number written as a string. The server writes it
        without trailing zeros ("11.4", not "11.40"). Use it for body fields
        only: a decimal query or path parameter is a plain string schema that
        the handler parses (see CONTRIBUTING.md).
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      examples: ["11.4"]
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    Exchange:
      type: string
      enum: [DFM, NASDAQ_DUBAI]
      x-go-type: domain.Exchange
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Currency:
      type: string
      enum: [AED, USD]
      x-go-type: domain.Currency
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Freshness:
      type: string
      description: |
        How current a value is: realtime from a live feed, delayed from a
        delayed feed, or eod from an end-of-day source.
      enum: [realtime, delayed, eod]
      x-go-type: domain.Freshness
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Source:
      type: string
      description: The feed a value came from.
      enum: [ibkr, dfm-mw, dfm-history, self-recorded]
      x-go-type: domain.Source
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Interval:
      type: string
      description: Bar length, one minute or one trading day.
      enum: [1m, 1d]
      x-go-type: domain.Interval
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    InstrumentClass:
      type: string
      enum: [equity, etf, reit, fund, bond, sukuk, future]
      x-go-type: domain.InstrumentClass
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    InstrumentStatus:
      type: string
      enum: [listed, suspended, delisted, matured]
      x-go-type: domain.InstrumentStatus
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Instrument:
      type: object
      description: A listed security.
      required: [symbol, exchange, nameEn, class, currency, status]
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        exchange:
          $ref: "#/components/schemas/Exchange"
        isin:
          type: string
          description: ISO 6166 code, omitted when unknown.
          pattern: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
          examples: [AEE000301011]
        nameEn:
          type: string
          examples: [Emaar Properties]
        nameAr:
          type: string
          description: Arabic name, omitted when unknown.
        class:
          $ref: "#/components/schemas/InstrumentClass"
        currency:
          $ref: "#/components/schemas/Currency"
        sector:
          type: string
          description: Sector name, omitted when unknown.
        board:
          type: string
          description: DFM board code, omitted when unknown.
          examples: ["510"]
        status:
          $ref: "#/components/schemas/InstrumentStatus"
        listedAt:
          type: string
          format: date
          description: First listing date, omitted when unknown.

    Quote:
      type: object
      description: |
        The latest level 1 snapshot of one instrument. A price of "0" or a
        size of 0 means the feed did not provide it; last is "0" until the
        first trade of the day.
      required:
        - symbol
        - last
        - bid
        - ask
        - bidSize
        - askSize
        - volume
        - trades
        - value
        - prevClose
        - asOf
        - source
        - freshness
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        last:
          $ref: "#/components/schemas/Decimal"
        bid:
          $ref: "#/components/schemas/Decimal"
        ask:
          $ref: "#/components/schemas/Decimal"
        bidSize:
          type: integer
          format: int64
          minimum: 0
        askSize:
          type: integer
          format: int64
          minimum: 0
        volume:
          type: integer
          format: int64
          minimum: 0
          description: Shares traded today.
        trades:
          type: integer
          format: int64
          minimum: 0
          description: Number of trades today.
        value:
          $ref: "#/components/schemas/Decimal"
        prevClose:
          $ref: "#/components/schemas/Decimal"
        lastTradeAt:
          type: string
          format: date-time
          description: Time of the last trade, omitted before the first trade.
        asOf:
          type: string
          format: date-time
          description: When the source produced this snapshot.
        source:
          $ref: "#/components/schemas/Source"
        freshness:
          $ref: "#/components/schemas/Freshness"

    Bar:
      type: object
      description: |
        OHLC bar. A 1d bar starts at midnight Asia/Dubai of its trading day;
        a 1m bar starts on a minute boundary. All prices are positive, or all
        are "0" with volume and value 0 on a day with no trades.
      required:
        - symbol
        - interval
        - start
        - open
        - high
        - low
        - close
        - volume
        - value
        - source
        - freshness
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        interval:
          $ref: "#/components/schemas/Interval"
        start:
          type: string
          format: date-time
          examples: ["2026-10-14T00:00:00+04:00"]
        open:
          $ref: "#/components/schemas/Decimal"
        high:
          $ref: "#/components/schemas/Decimal"
        low:
          $ref: "#/components/schemas/Decimal"
        close:
          $ref: "#/components/schemas/Decimal"
        volume:
          type: integer
          format: int64
          minimum: 0
        value:
          $ref: "#/components/schemas/Decimal"
        source:
          $ref: "#/components/schemas/Source"
        freshness:
          $ref: "#/components/schemas/Freshness"

    # ==========================================================================
    # foundation (F00)
    # ==========================================================================

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          description: ok when every dependency is ok, otherwise unavailable.
          enum: [ok, unavailable]
          x-order: 1
          x-enum-varnames: [HealthStatusOK, HealthStatusUnavailable]
        db:
          type: string
          description: Whether the database answered a ping.
          enum: [ok, unavailable]
          x-go-name: DB
          x-order: 2
          x-enum-varnames: [HealthDBOK, HealthDBUnavailable]

    Role:
      type: string
      description: |
        owner has every permission, including market data and trading.
        member can use chat and layouts only.
      enum: [owner, member]
      x-go-type: auth.Role
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/auth

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Case-insensitive.
          examples: [saud]
        password:
          type: string
          format: password

    Me:
      type: object
      description: The signed-in account and its session.
      required: [id, username, role, csrfToken]
      properties:
        id:
          type: integer
          format: int64
          x-go-name: ID
          x-order: 1
        username:
          type: string
          examples: [saud]
          x-order: 2
        role:
          $ref: "#/components/schemas/Role"
          x-order: 3
        csrfToken:
          type: string
          description: Send in the X-CSRF-Token header on POST, PUT, PATCH, and DELETE.
          x-go-name: CSRFToken
          x-order: 4

    MarketSession:
      type: string
      description: |
        The phase of the DFM trading day in Asia/Dubai: pre-open from 09:30,
        continuous from 10:00, closing-auction from 14:45 (DFM's pre-closing
        and trade-at-last sessions), and closed from 15:00 and on days DFM
        does not trade. The times are the defaults; the server's config sets
        them.
      enum: [pre-open, continuous, closing-auction, closed]
      x-go-type: calendar.Session
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/calendar

    MarketStatus:
      type: object
      required: [session, nextOpen]
      properties:
        session:
          $ref: "#/components/schemas/MarketSession"
          x-order: 1
        nextOpen:
          type: string
          format: date-time
          x-order: 2
          description: |
            The next start of continuous trading strictly after now, in
            +04:00. This is the continuous open, not the pre-open.
          examples: ["2026-10-19T10:00:00+04:00"]

