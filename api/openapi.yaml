components:
  responses:
    Error:
      description: The request failed. The body says why.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ==========================================================================
    # shared: errors, scalars, and the core market types (internal/domain)
    # ==========================================================================

    Error:
      type: object
      description: The body of every non-2xx response.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable reason in snake_case. Clients branch on
            this, never on message. Known codes: bad_request, unauthorized,
            forbidden, not_found, method_not_allowed, conflict, internal,
            unavailable (a dependency such as the database did not answer;
            retry later).
          examples: [not_found]
        message:
          type: string
          description: Human-readable detail. Safe to show to the user.
          examples: ["instrument EMAAR not found"]

    Symbol:
      type: string
      description: |
        DFM trading code: 1 to 16 characters of A-Z and 0-9, with inner
        space, '-', '_', or '.' (for example "EMAAR", "NBD GULF",
        "TAKAFUL-EM", "SALAM_BAH"). The server upper-cases and trims input
        symbols before validating them.
      minLength: 1
      maxLength: 16
      pattern: "^[A-Z0-9]([A-Z0-9 ._-]*[A-Z0-9])?$"
      examples: [EMAAR]

    Decimal:
      type: string
      description: |
        An exact decimal number written as a string. The server writes it
        without trailing zeros ("11.4", not "11.40"). Use it for body fields
        only: a decimal query or path parameter is a plain string schema that
        the handler parses (see CONTRIBUTING.md).
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      examples: ["11.4"]
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    Exchange:
      type: string
      enum: [DFM, NASDAQ_DUBAI]
      x-go-type: domain.Exchange
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Currency:
      type: string
      enum: [AED, USD]
      x-go-type: domain.Currency
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Freshness:
      type: string
      description: |
        How current a value is: realtime from a live feed, delayed from a
        delayed feed, or eod from an end-of-day source.
      enum: [realtime, delayed, eod]
      x-go-type: domain.Freshness
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Source:
      type: string
      description: The feed a value came from.
      enum: [ibkr, dfm-mw, dfm-history, self-recorded]
      x-go-type: domain.Source
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Interval:
      type: string
      description: Bar length, one minute or one trading day.
      enum: [1m, 1d]
      x-go-type: domain.Interval
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    InstrumentClass:
      type: string
      enum: [equity, etf, reit, fund, bond, sukuk, future]
      x-go-type: domain.InstrumentClass
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    InstrumentStatus:
      type: string
      enum: [listed, suspended, delisted, matured]
      x-go-type: domain.InstrumentStatus
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/domain

    Instrument:
      type: object
      description: A listed security.
      required: [symbol, exchange, nameEn, class, currency, status]
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        exchange:
          $ref: "#/components/schemas/Exchange"
        isin:
          type: string
          description: ISO 6166 code, omitted when unknown.
          pattern: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
          examples: [AEE000301011]
        nameEn:
          type: string
          examples: [Emaar Properties]
        nameAr:
          type: string
          description: Arabic name, omitted when unknown.
        class:
          $ref: "#/components/schemas/InstrumentClass"
        currency:
          $ref: "#/components/schemas/Currency"
        sector:
          type: string
          description: Sector name, omitted when unknown.
        board:
          type: string
          description: DFM board code, omitted when unknown.
          examples: ["510"]
        status:
          $ref: "#/components/schemas/InstrumentStatus"
        listedAt:
          type: string
          format: date
          description: First listing date, omitted when unknown.

    Quote:
      type: object
      description: |
        The latest level 1 snapshot of one instrument. A price of "0" or a
        size of 0 means the feed did not provide it; last is "0" until the
        first trade of the day.
      required:
        - symbol
        - last
        - bid
        - ask
        - bidSize
        - askSize
        - volume
        - trades
        - value
        - prevClose
        - asOf
        - source
        - freshness
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        last:
          $ref: "#/components/schemas/Decimal"
        bid:
          $ref: "#/components/schemas/Decimal"
        ask:
          $ref: "#/components/schemas/Decimal"
        bidSize:
          type: integer
          format: int64
          minimum: 0
        askSize:
          type: integer
          format: int64
          minimum: 0
        volume:
          type: integer
          format: int64
          minimum: 0
          description: Shares traded today.
        trades:
          type: integer
          format: int64
          minimum: 0
          description: Number of trades today.
        value:
          $ref: "#/components/schemas/Decimal"
        prevClose:
          $ref: "#/components/schemas/Decimal"
        lastTradeAt:
          type: string
          format: date-time
          description: Time of the last trade, omitted before the first trade.
        asOf:
          type: string
          format: date-time
          description: When the source produced this snapshot.
        source:
          $ref: "#/components/schemas/Source"
        freshness:
          $ref: "#/components/schemas/Freshness"

    Bar:
      type: object
      description: |
        OHLC bar. A 1d bar starts at midnight Asia/Dubai of its trading day;
        a 1m bar starts on a minute boundary. All prices are positive, or all
        are "0" with volume and value 0 on a day with no trades.
      required:
        - symbol
        - interval
        - start
        - open
        - high
        - low
        - close
        - volume
        - value
        - source
        - freshness
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        interval:
          $ref: "#/components/schemas/Interval"
        start:
          type: string
          format: date-time
          examples: ["2026-10-14T00:00:00+04:00"]
        open:
          $ref: "#/components/schemas/Decimal"
        high:
          $ref: "#/components/schemas/Decimal"
        low:
          $ref: "#/components/schemas/Decimal"
        close:
          $ref: "#/components/schemas/Decimal"
        volume:
          type: integer
          format: int64
          minimum: 0
        value:
          $ref: "#/components/schemas/Decimal"
        source:
          $ref: "#/components/schemas/Source"
        freshness:
          $ref: "#/components/schemas/Freshness"

    # ==========================================================================
    # foundation (F00)
    # ==========================================================================

    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          description: ok when every dependency is ok, otherwise unavailable.
          enum: [ok, unavailable]
          x-order: 1
          x-enum-varnames: [HealthStatusOK, HealthStatusUnavailable]
        db:
          type: string
          description: Whether the database answered a ping.
          enum: [ok, unavailable]
          x-go-name: DB
          x-order: 2
          x-enum-varnames: [HealthDBOK, HealthDBUnavailable]

    MarketSession:
      type: string
      description: |
        The phase of the DFM trading day in Asia/Dubai: pre-open from 09:30,
        continuous from 10:00, closing-auction from 14:45 (DFM's pre-closing
        and trade-at-last sessions), and closed from 15:00 and on days DFM
        does not trade. The times are the defaults; the server's config sets
        them.
      enum: [pre-open, continuous, closing-auction, closed]
      x-go-type: calendar.Session
      x-go-type-import:
        path: github.com/saudm6/dfm-be/internal/calendar

    MarketStatus:
      type: object
      required: [session, nextOpen]
      properties:
        session:
          $ref: "#/components/schemas/MarketSession"
          x-order: 1
        nextOpen:
          type: string
          format: date-time
          x-order: 2
          description: |
            The next start of continuous trading strictly after now, in
            +04:00. This is the continuous open, not the pre-open.
          examples: ["2026-10-19T10:00:00+04:00"]

    # ==========================================================================
    # security-master (F01)
    # ==========================================================================

    # ==========================================================================
    # quotes (F02)
    # ==========================================================================

